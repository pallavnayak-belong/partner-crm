<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belong Partners</title>
<script>try{var t=localStorage.getItem('pcrm-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="styles.css"></head>
<body>
<aside id="side">
  <div class="brand"><img src="logo-light.png" alt="Belong"><span>Partners</span></div>
  <button id="addnew">+ Add partner</button>
  <nav id="nav">
    <a href="#/dashboard" data-r="dashboard"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg><span>Dashboard</span></a>
    <div class="grp">Reach out</div>
    <a href="#/discover" data-r="discover"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Find partners</span></a>
    <a href="#/pipeline" data-r="pipeline"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="6" rx="1"/></svg><span>Pipeline</span></a>
    <a href="#/templates" data-r="templates"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>Email templates</span></a>
    <a href="#/sequence" data-r="sequence"><svg viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M20 10a8 8 0 00-14-3L4 10M4 14a8 8 0 0014 3l2-3"/></svg><span>Follow-up emails</span><b id="navseq" hidden></b></a>
    <a href="#/reach" data-r="reach"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/><path d="M17 17l4 4M21 17l-4 4" stroke-width="2"/></svg><span>Missing emails</span><b id="navreach" hidden></b></a>
    <a href="#/sends" data-r="sends"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg><span>Send log</span></a>
    <a href="#/tasks" data-r="tasks"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>To-do</span><b id="navdue" hidden></b></a>
    <div class="grp">Sign up &amp; onboard</div>
    <a href="#/applications" data-r="applications"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></svg><span>Applications</span><b id="navapp" hidden></b></a>
    <a href="#/onboarding" data-r="onboarding"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 7-7"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg><span>Onboarding</span></a>
    <div class="grp">Results</div>
    <a href="#/funnel" data-r="funnel"><svg viewBox="0 0 24 24"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg><span>Funnel</span></a>
    <a href="#/performance" data-r="performance"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span>Partner performance</span></a>
    <div class="grp">Setup</div>
    <a href="#/backups" data-r="backups"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 010-8 5 5 0 019.6-1.2A4.5 4.5 0 0117 18z"/><path d="M12 12v6M9.5 15.5L12 18l2.5-2.5"/></svg><span>Backups</span><b id="navbk" hidden>!</b></a>
    <a href="#/settings" data-r="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 00-2-1.2L14 3h-4l-.6 2.7a7 7 0 00-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 005 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 002 1.2L10 21h4l.6-2.7a7 7 0 002-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg><span>Settings</span></a>
  </nav>
  <a id="bkchip" href="#/backups" hidden></a>
  <div class="who"><span>Working as</span><select id="whoami"><option value="">Not set</option></select></div>
  <div class="sidefoot"><span id="sidecount"></span><button id="themebtn" title="Switch light / dark"><svg viewBox="0 0 24 24"><path id="themeico" d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><span id="themelab">Dark</span></button></div>
</aside>
<main><div id="bkbanner" hidden></div><div id="view"></div></main>
<div id="toast" hidden></div>
<script src="app.js"></script></body></html>
